<html><head><meta charset="utf-8"></head><body>

<script>
const D = __DATA__; K.datos(D);
const OV = K.capa2D(), CON = !window.SIN_ACABADO;
if (CON) window.DESENFOQUE = [{ desde: 0.35, hasta: 1.1, muestras: 8, obturador: 0.5 }];
const fondo = (g, c1, c2) => { const gr = g.createLinearGradient(0, 0, 0, K.H); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, K.W, K.H); g.strokeStyle = 'rgba(255,255,255,0.06)'; g.lineWidth = 2; for (let x = 0; x < K.W; x += 90) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, K.H); g.stroke(); } for (let y = 0; y < K.H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(K.W, y); g.stroke(); } };
window.renderAt = t => {
  OV.limpiar();
  if (t < 2) {
    fondo(OV, '#10224a', '#060b1a');
    const u = K.ease3(K.clamp((t - 0.4) / 0.6)), x = K.lerp(-200, K.W + 200, u);
    OV.save(); OV.translate(x, 960); OV.rotate(u * 12);
    OV.fillStyle = '#f5c542'; OV.beginPath(); OV.arc(0, 0, 150, 0, 7); OV.fill(); OV.lineWidth = 14; OV.strokeStyle = '#b8860b'; OV.stroke();
    OV.fillStyle = '#b8860b'; OV.font = '900 150px Inter'; OV.textAlign = 'center'; OV.textBaseline = 'middle'; OV.fillText('$', 0, 8); OV.restore();
    K.txt(OV, 'una moneda que cruza rápido', 540, 1350, 46, '#fff', 1, 700);
  } else {
    fondo(OV, '#3a1405', '#120604');
    const u = K.clamp((t - 2) / 2), s = CON ? K.zoomParejo(1, 3, u) : K.lerp(1, 3, u);
    OV.save(); OV.translate(540, 960); OV.scale(s, s); if (K.ico) K.ico(OV, 'car', 0, 0, 260, { color: '#ff9a3d' }); OV.restore();
    K.txt(OV, CON ? 'acercamiento parejo' : 'acercamiento lineal', 540, 1500, 46, '#fff', 1, 700);
  }
  if (CON) K.luzFuga(OV, K.W, K.H, K.clamp((t - 1.6) / 0.8), { semilla: 3 });
  K.txt(OV, CON ? 'CON ACABADO' : 'SIN ACABADO', 540, 260, 60, CON ? '#ffd98a' : '#9aa4b8', 1, 900);
};
window.listo = true;
</script></body></html>
